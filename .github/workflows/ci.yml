name: CI
on:
  push: { branches: [main, master] }
  pull_request: { branches: [main, master] }

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.6
      - run: ruff check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest -v

  test-debian:
    runs-on: ubuntu-latest
    container: debian:12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install Python + pip
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv
      - name: Install mesh-review
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --upgrade pip
          /tmp/venv/bin/pip install -e .[dev]
      - name: Run tests
        run: /tmp/venv/bin/pytest -v

  test-alpine:
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (musl)
        run: apk add --no-cache gcc musl-dev
      - name: Install mesh-review
        run: |
          pip install --quiet --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: pytest -v

