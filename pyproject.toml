[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-review"
version = "0.1.0"
description = "Modular multi-LLM PR review and summary toolkit. Vendor-neutral CLI registry powers consensus review with adversarial Sigma falsification AND PR-description summarization. CI-ready GitHub Action."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = []
keywords = ["pr", "code-review", "ci", "multi-llm", "modular", "sigma", "falsification", "github-action"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]

[project.scripts]
mesh-review = "mesh_review.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
